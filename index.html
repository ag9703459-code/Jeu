  
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Strike Zone 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d13;color:white;
font-family:Arial,sans-serif;overflow:hidden}
button{background:#182b3c;color:white;border:1px solid #456079;
padding:12px;border-radius:7px;font-weight:bold;cursor:pointer}
button:active{background:#287d91}
#game{position:fixed;inset:0}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{pointer-events:auto;background:#101b28ee;
border:1px solid #345064;border-radius:12px;padding:20px}
#menu{position:absolute;inset:0;display:flex;
align-items:center;justify-content:center;
background:linear-gradient(90deg,#07101bee,#07101b88,#07101b22)}
.content{width:min(550px,90vw)}
h1{font-size:clamp(32px,6vw,64px);margin:0 0 8px}
h1 span{color:#50d9d0}
p{color:#b6c6d5}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}
#top{position:absolute;top:12px;left:12px;right:12px;
display:none;justify-content:space-between;align-items:center}
#catalog{position:absolute;inset:5%;display:none;
overflow:auto;pointer-events:auto}
#items{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#items button{font-size:12px;min-height:60px}
#cross{position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);font-size:24px;color:#fff}
#controls{position:absolute;bottom:18px;left:18px;right:18px;
display:none;justify-content:space-between;align-items:end}
.pad{display:grid;grid-template-columns:repeat(3,52px);gap:4px}
.pad button{height:48px;background:#152638bb}
#fire{width:82px;height:82px;border-radius:50%;
background:#a62e31dd}
#hint{position:absolute;bottom:8px;left:0;right:0;
text-align:center;font-size:11px;color:#d6e1e9}
@media(orientation:portrait){
 #menu:after{content:"Tourne ton téléphone à l’horizontale ↻";
 position:absolute;bottom:12px;left:5%;right:5%;
 text-align:center;background:#162a3b;padding:12px;border-radius:8px}
}
@media(max-width:600px){#items{grid-template-columns:repeat(2,1fr)}
.panel{padding:14px}.content{width:94vw}}
</style>
</head>
<body>
<div id="game"></div>
<div id="ui">
 <div id="menu">
  <div class="content panel">
   <p>JEU DE TIR • UNIVERS 3D</p>
   <h1>STRIKE <span>ZONE</span></h1>
   <p>Combattez dans des environnements urbains
   et personnalisez votre équipement.</p>
   <div class="buttons">
    <button onclick="startGame()">▶ JOUER</button>
    <button onclick="openCatalog('armes')">⚙ ARSENAL</button>
    <button onclick="openCatalog('skins')">◈ CAMOUFLAGES</button>
    <button onclick="openCatalog('maps')">▦ CARTES</button>
   </div>
   <p id="status">3D • Mode paysage • 50 cartes</p>
  </div>
 </div>
 <div id="top">
  <button onclick="backMenu()">☰ MENU</button>
  <b id="weaponLabel">ARME 01</b>
  <button onclick="openCatalog('armes')">ARSENAL</button>
 </div>
 <div id="catalog" class="panel">
  <button onclick="closeCatalog()">← RETOUR</button>
  <h2 id="catTitle">ARSENAL</h2>
  <p id="catInfo">Sélectionne un élément.</p>
  <div id="items"></div>
 </div>
 <div id="cross" style="display:none">+</div>
 <div id="controls">
  <div class="pad">
   <span></span><button data-move="forward">▲</button><span></span>
   <button data-move="left">◀</button>
   <button data-move="back">▼</button>
   <button data-move="right">▶</button>
  </div>
  <button id="fire">TIR</button>
 </div>
 <div id="hint"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const weaponTypes=[
 "Assaut","SMG","Précision","Soutien","Tactique",
 "Éclaireur","Défense","Élite","Prototype","Légendaire"
];
const weapons=Array.from({length:100},(_,i)=>({
 name:weaponTypes[i%10]+" "+String(i+1).padStart(2,"0"),
 id:i
}));
const skins=[
 "Forêt","Désert","Arctique","Urbain","Digital",
 "Pixel","Carbone","Or","Nuit","Jungle",
 "Océan","Rouge","Spectre","Neon","Hexagone",
 "Marbre","Acier","Tropical","Cendre","Émeraude"
];
const camos=Array.from({length:100},(_,i)=>
 skins[i%skins.length]+" "+String(i+1).padStart(2,"0"));
const mapBases=[
"Centre-ville","Désert","Port industriel","Base militaire",
"Forêt dense","Montagnes","Entrepôt","Zone portuaire",
"Quartier ancien","Complexe futuriste"
];
const maps=Array.from({length:50},(_,i)=>
 mapBases[i%10]+" "+(Math.floor(i/10)+1));
let scene,camera,renderer,player,gun,started=false;
let selectedMap=0,selectedWeapon=0,selectedSkin=0;
let buildings=[],bullets=[],enemies=[];
let held={},lastTime=0;

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x9ab5c4);
 scene.fog=new THREE.Fog(0x9ab5c4,35,150);
 camera=new THREE.PerspectiveCamera(
  75,innerWidth/innerHeight,.1,300);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 $("game").appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xc6e4ff,0x444738,2));
 const sun=new THREE.DirectionalLight(0xffedce,2.4);
 sun.position.set(25,40,20);
 sun.castShadow=true;
 scene.add(sun);
 buildMap();
 player=new THREE.Group();
 player.position.set(0,1.7,12);
 scene.add(player);
 camera.position.set(0,0,0);
 player.add(camera);
 camera.rotation.order="YXZ";
 const g=new THREE.Group();
 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.22,.18,.75),
  new THREE.MeshStandardMaterial({color:0x283b42}));
 body.position.set(.32,-.25,-.55);
 g.add(body);
 const barrel=new THREE.Mesh(
  new THREE.CylinderGeometry(.035,.045,.65,8),
  new THREE.MeshStandardMaterial({color:0x687985,metalness:.7}));
 barrel.rotation.x=Math.PI/2;
 barrel.position.set(.32,-.22,-1.05);
 g.add(barrel);
 camera.add(g);gun=g;
 window.addEventListener("resize",resize);
 window.addEventListener("keydown",e=>held[e.key.toLowerCase()]=true);
 window.addEventListener("keyup",e=>held[e.key.toLowerCase()]=false);
 renderer.domElement.addEventListener("click",()=>{
  if(started&&$("catalog").style.display==="none")shoot();
 });
 renderer.domElement.addEventListener("pointermove",e=>{
  if(!started||e.buttons!==2)return;
  player.rotation.y-=e.movementX*.003;
  camera.rotation.x-=e.movementY*.003;
  camera.rotation.x=Math.max(-1.3,Math.min(1.3,camera.rotation.x));
 });
 renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());
 setupTouch();
 animate();
}
function material(color){
 return new THREE.MeshStandardMaterial({
  color,roughness:.83,metalness:.08
 });
}
function addBox(x,y,z,w,h,d,color){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
 scene.add(m);buildings.push(m);return m;
}
function clearMap(){
 for(const b of buildings)scene.remove(b);
 buildings=[];
}
function buildMap(){
 clearMap();
 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(180,180),
  material(0x777d70));
 ground.rotation.x=-Math.PI/2;
 ground.position.y=-.06;ground.receiveShadow=true;scene.add(ground);
 const road=addBox(0,.01,0,14,.04,150,0x343a3e);
 // Procedurally arranged buildings with doors and windows.
 let seed=selectedMap+123;
 const rand=()=>{seed=(seed*1664525+1013904223)>>>0;
 return seed/4294967296};
 for(let i=0;i<64;i++){
  let x=(rand()-.5)*90,z=(rand()-.5)*100;
  if(Math.abs(x)<11) x+=(x<0?-12:12);
  if(Math.abs(z)<8&&Math.abs(x)<20)z+=18;
  const w=4+rand()*8,h=4+rand()*17,d=5+rand()*8;
  const palette=[0x747b82,0x9a8e7b,0x515f69,0xb1a28c,0x596b62];
  addBox(x,h/2,z,w,h,d,palette[Math.floor(rand()*palette.length)]);
  // Visible facade windows
  const rows=Math.max(1,Math.floor(h/2.4));
  const cols=Math.max(1,Math.floor(w/1.7));
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
   const wx=x-w/2+(c+.5)*w/cols;
   const wy=1.3+r*2;
   const wz=z-d/2-.026;
   if(wy<h-.3){
    const win=new THREE.Mesh(
     new THREE.BoxGeometry(.65,.85,.06),
     material(rand()>.45?0x8bc1cb:0x273947));
    win.position.set(wx,wy,wz);scene.add(win);buildings.push(win);
   }
  }
 }
 // Cover objects and crates
 for(let i=0;i<28;i++){
  const x=(rand()-.5)*55,z=(rand()-.5)*65;
  if(Math.abs(x)<9)continue;
  addBox(x,.65,z,2.2,1.3,2,rand()>.5?0x536c59:0x8a704f);
 }
 // Simple target dummies
 for(let i=0;i<7;i++){
  const target=new THREE.Group();
  const torso=new THREE.Mesh(new THREE.BoxGeometry(.8,1.1,.45),material(0x963e35));
  torso.position.y=1.1;target.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.27,10,8),material(0xc5a17d));
  head.position.y=1.9;target.add(head);
  target.position.set((i-3)*5,0,-18-Math.random()*15);
  scene.add(target);enemies.push(target);
 }
}
function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}
function startGame(){
 $("menu").style.display="none";
 $("top").style.display="flex";
 $("cross").style.display="block";
 $("controls").style.display="flex";
 $("hint").textContent="ZQSD / WASD pour bouger • clic pour tirer • clic droit + souris pour regarder";
 started=true;
}
function backMenu(){
 started=false;
 $("menu").style.display="flex";$("top").style.display="none";
 $("controls").style.display="none";$("cross").style.display="none";
 $("hint").textContent="";
 closeCatalog();
}
function openCatalog(type){
 const titles={armes:"ARSENAL — 100 ARMES",
 skins:"CAMOUFLAGES — 100 MOTIFS",maps:"CARTES — 50 ENVIRONNEMENTS"};
 $("catTitle").textContent=titles[type];
 $("catInfo").textContent=type==="armes"?
 "Choisis ton équipement.":
 type==="skins"?"Choisis l'apparence de ton arme.":
 "Choisis un environnement 3D.";
 const list=type==="armes"?weapons.map(w=>w.name):
 type==="skins"?camos:maps;
 $("items").innerHTML="";
 list.forEach((name,i)=>{
  const b=document.createElement("button");
  b.textContent=String(i+1).padStart(2,"0")+" · "+name;
  b.onclick=()=>{
   if(type==="armes"){
    selectedWeapon=i;$("weaponLabel").textContent=name;
    gun.children.forEach(o=>{
     if(o.material)o.material.color.setHex(
      [0x283b42,0x45513a,0x777777,0x8b6d43][i%4]);
    });
   }else if(type==="skins"){
    selectedSkin=i;
    gun.children.forEach(o=>{
     if(o.material)o.material.color.setHSL((i%100)/100,.6,.45);
    });
   }else{
    selectedMap=i;buildMap();
    player.position.set(0,1.7,12);
   }
   $("catInfo").textContent="Sélectionné : "+name;
  };
  $("items").appendChild(b);
 });
 $("catalog").style.display="block";
}
function closeCatalog(){$("catalog").style.display="none"}
function shoot(){
 const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
 const mesh=new THREE.Mesh(new THREE.SphereGeometry(.07,6,6),
 material(0xffd37a));
 mesh.position.copy(camera.getWorldPosition(new THREE.Vector3()));
 scene.add(mesh);bullets.push({mesh,dir,life:1.5});
}
function setupTouch(){
 document.querySelectorAll("[data-move]").forEach(btn=>{
  const k=btn.dataset.move;
  const on=()=>held["touch_"+k]=true;
  const off=()=>held["touch_"+k]=false;
  btn.addEventListener("pointerdown",e=>{e.preventDefault();on()});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>
   btn.addEventListener(ev,off));
 });
 $("fire").addEventListener("pointerdown",e=>{e.preventDefault();shoot()});
 let lastX=0,lastY=0;
 renderer.domElement.addEventListener("touchstart",e=>{
  if(e.touches.length){lastX=e.touches[0].clientX;lastY=e.touches[0].clientY}
 },{passive:true});
 renderer.domElement.addEventListener("touchmove",e=>{
  if(!started||$("catalog").style.display!=="none")return;
  const t=e.touches[0],dx=t.clientX-lastX,dy=t.clientY-lastY;
  if(t.clientX>innerWidth*.35){
   player.rotation.y-=dx*.006;
   camera.rotation.x=Math.max(-1.2,Math.min(1.2,camera.rotation.x-dy*.004));
  }
  lastX=t.clientX;lastY=t.clientY;
 },{passive:true});
}
function animate(time=0){
 requestAnimationFrame(animate);
 const dt=Math.min((time-lastTime)/1000,.04);lastTime=time;
 if(started&&$("catalog").style.display==="none"){
  const speed=9*dt;
  const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(
   new THREE.Vector3(0,1,0),player.rotation.y);
  const right=new THREE.Vector3(1,0,0).applyAxisAngle(
   new THREE.Vector3(0,1,0),player.rotation.y);
  if(held.w||held.z||held.touch_forward)player.position.addScaledVector(forward,speed);
  if(held.s||held.touch_back)player.position.addScaledVector(forward,-speed);
  if(held.a||held.q||held.touch_left)player.position.addScaledVector(right,-speed);
  if(held.d||held.touch_right)player.position.addScaledVector(right,speed);
 }
 bullets=bullets.filter(b=>{
  b.mesh.position.addScaledVector(b.dir,35*(1/60));
  b.life-=1/60;
  if(b.life<=0){scene.remove(b.mesh);return false}return true;
 });
 renderer.render(scene,camera);
}
init();
</script>
</body>
</html>
